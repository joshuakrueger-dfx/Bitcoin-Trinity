# Test environment — docs/TESTING.md §2
#
# Image digests are pinned (WP-02 acceptance). Tags kept as comments for
# humans. Re-pin after deliberate upgrades: docker pull <image>:<tag> &&
# docker inspect --format='{{index .RepoDigests 0}}' <image>:<tag>
#
# ⚠️ Bitcoin Core 30.0 and 30.1 are forbidden (wallet migration bug,
#    binaries withdrawn on 2026-01-05). scripts/test-env.sh checks the
#    running version via getnetworkinfo and hard-aborts.

services:
  bitcoind:
    # bitcoin/bitcoin:30.2
    image: bitcoin/bitcoin@sha256:2b1d8a8d23c67b426afa8cd5b3ffd66b8c4ebbbceef3e214df8627aaead1f517
    command:
      - -regtest=1
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=trinity
      - -rpcpassword=regtest
      - -fallbackfee=0.0002
      - -txindex=1
      - -blockfilterindex=1      # for CBF (BIP-157/158), WP-16
      - -peerblockfilters=1
      # -deprecatedrpc=create_bdb deliberately NOT set: the project uses
      # exclusively descriptor wallets (createwallet … descriptors=true).
      # The flag would unlock the legacy BDB path that the wallet bug
      # of Core 30.0/30.1 hung on — do not re-enter out of habit.
    ports:
      # Host bind is loopback-only: static test credentials must not be
      # reachable on every interface. Container↔container still uses the
      # Compose network (electrs → bitcoind:18443/18444).
      - "127.0.0.1:18443:18443"  # RPC regtest
      - "127.0.0.1:18444:18444"  # P2P regtest
    volumes:
      - bitcoind-data:/home/bitcoin/.bitcoin
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=trinity", "-rpcpassword=regtest", "getblockchaininfo"]
      interval: 2s
      timeout: 5s
      retries: 30

  electrs:
    # Backend for trinity-chain::ElectrumBackend (WP-14)
    # getumbrel/electrs:v0.10.9 — CLI exposes --cookie-file only; user/pass auth
    # is the `auth` key in a config file (Auth::UserPass). Same credentials as
    # bitcoind -rpcuser/-rpcpassword. A synthetic cookie file was rejected by
    # bitcoincore-rpc against Core 30.2 (HTTP 401); conf-auth works.
    image: getumbrel/electrs@sha256:622657fbdc7331a69f5b3444e6f87867d51ac27d90c399c8bf25d9aab020052b
    depends_on:
      bitcoind:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/electrs.toml <<'EOF'
        auth = "trinity:regtest"
        network = "regtest"
        daemon_rpc_addr = "bitcoind:18443"
        daemon_p2p_addr = "bitcoind:18444"
        electrum_rpc_addr = "0.0.0.0:60401"
        db_dir = "/data/db"
        EOF
        exec electrs --conf /tmp/electrs.toml --skip-default-conf-files
    ports:
      - "127.0.0.1:60401:60401"
    volumes:
      - electrs-data:/data

volumes:
  bitcoind-data:
  electrs-data:

# Testumgebung — docs/TESTING.md §2
#
# Ist-Zustand: Images hängen an Tags (siehe TODO(WP-02) unten). Tags sind
# veränderlich — Digest-Pinning ist Abnahmekriterium von WP-02 und macht den
# Aufbau reproduzierbar und offline-fähig nach dem ersten Pull.
#
# ⚠️ Bitcoin Core 30.0 und 30.1 sind verboten (Wallet-Migrations-Bug,
#    Binaries am 2026-01-05 zurückgezogen). scripts/test-env.sh prüft die
#    laufende Version über getnetworkinfo und bricht hart ab.

services:
  bitcoind:
    # TODO(WP-02): Digest eintragen, sobald das Image ausgewählt ist —
    # image: <repo>@sha256:<digest>
    image: bitcoin/bitcoin:30.2
    command:
      - -regtest=1
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=trinity
      - -rpcpassword=regtest
      - -fallbackfee=0.0002
      - -txindex=1
      - -blockfilterindex=1      # für CBF (BIP-157/158), WP-16
      - -peerblockfilters=1
      # -deprecatedrpc=create_bdb bewusst NICHT gesetzt: das Projekt nutzt
      # ausschließlich Descriptor-Wallets (createwallet … descriptors=true).
      # Das Flag würde den Legacy-BDB-Pfad freischalten, an dem der Wallet-Bug
      # von Core 30.0/30.1 hing — nicht aus Gewohnheit wieder eintragen.
    ports:
      - "18443:18443"            # RPC regtest
      - "18444:18444"            # P2P regtest
    volumes:
      - bitcoind-data:/home/bitcoin/.bitcoin
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=trinity", "-rpcpassword=regtest", "getblockchaininfo"]
      interval: 2s
      timeout: 5s
      retries: 30

  electrs:
    # Backend für trinity-chain::ElectrumBackend (WP-14)
    image: getumbrel/electrs:v0.10.9
    depends_on:
      bitcoind:
        condition: service_healthy
    command:
      - --network=regtest
      - --daemon-rpc-addr=bitcoind:18443
      - --daemon-p2p-addr=bitcoind:18444
      - --electrum-rpc-addr=0.0.0.0:60401
      - --cookie=trinity:regtest
    ports:
      - "60401:60401"
    volumes:
      - electrs-data:/data

volumes:
  bitcoind-data:
  electrs-data:

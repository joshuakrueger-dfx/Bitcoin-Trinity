# Schneller Pfad (< 10 min) bei jedem Push.
# Differential D1–D19: bei jedem PR, sobald der Harness existiert (TESTING.md §5).
# Signet und Mutants: nach main (TESTING.md §5).
# Aufbau und Begründung: docs/TESTING.md §5
name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # --- Schneller Pfad: bricht bei jeder Warnung -------------------------------
  check:
    name: fmt · clippy · build · docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"            # aus rust-toolchain.toml, bewusst exakt
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatierung
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (Lockfile bindend)
        run: cargo build --workspace --locked

      # Prüft die vier Dokumente gegeneinander: jede Test-ID hat genau ein WP,
      # jede Entscheidung ein umsetzendes Paket, kein toter Abschnittsverweis.
      - name: check-plan
        run: python3 scripts/check_plan.py

      # "Jede Abhängigkeit im Signaturpfad ist ein Angriffsvektor auf fremdes Geld."
      - name: Signaturpfad-Budget
        run: python3 scripts/dep_budget.py

  # --- Tests -----------------------------------------------------------------
  test:
    name: Unit · Property
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.94.1" }
      - uses: Swatinem/rust-cache@v2
      - name: Tests mit festem Seed
        env:
          PROPTEST_RNG_SEED: "0x5452494e495459"   # "TRINITY" — reproduzierbare Fehlschläge
        run: cargo test --workspace --locked

  # --- Supply Chain ----------------------------------------------------------
  supply-chain:
    name: deny · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.94.1" }
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-deny,cargo-audit" }
      # Lizenz-Allowlist: eine unbekannte Lizenz bricht den Build, statt
      # durchzurutschen. Freigabekriterium 9b.
      - run: cargo deny check
      - run: cargo audit --deny warnings

  # --- FFI-Grenze ------------------------------------------------------------
  # Diese Grenze ist zu wichtig, um sie dem Code-Review zu überlassen.
  # Skript scripts/check_ffi_boundary.py und Allowlist
  # crates/trinity-ffi/ffi-allowlist.toml kommen aus WP-40 — der Job gated
  # bewusst auf die Allowlist und startet erst, wenn beide existieren.
  ffi-boundary:
    name: FFI-Allowlist
    runs-on: ubuntu-latest
    if: hashFiles('crates/trinity-ffi/ffi-allowlist.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.94.1" }
      - run: python3 scripts/check_ffi_boundary.py

  # --- Coverage --------------------------------------------------------------
  coverage:
    name: Coverage-Gate
    runs-on: ubuntu-latest
    if: hashFiles('crates/*/src/*.rs') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-llvm-cov" }
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      # Schwellen je Crate aus docs/TESTING.md §3.2; Ausnahmen brauchen
      # eine Begründung in coverage-exclusions.toml
      - run: python3 scripts/coverage_gate.py lcov.info

  # --- Differential: bei jedem PR, sobald der Harness existiert (TESTING.md §5)
  # Reaktivierung: WP-23 liefert tests/differential/ und das Cargo-Feature
  # `differential`. Danach entfällt die hashFiles-Bedingung; die run-Zeile
  # bleibt unverändert.
  differential:
    name: Differential gegen Bitcoin Core 30.2
    runs-on: ubuntu-latest
    needs: [check, test]
    if: hashFiles('tests/differential/**') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.94.1" }
      - name: Testumgebung hochfahren
        run: ./scripts/test-env.sh up
      - name: D1–D19
        run: cargo test --workspace --locked --features differential -- --test-threads=1
      - if: always()
        run: ./scripts/test-env.sh down

  # --- Signet: nach main, sobald der Harness existiert (TESTING.md §5)
  # Reaktivierung: WP-45 liefert tests/signet-e2e/ und das Cargo-Feature
  # `signet` (S1–S8/S32). Danach entfällt die hashFiles-Bedingung; die
  # run-Zeile bleibt unverändert.
  signet:
    name: Signet-Szenarien S1–S36
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && hashFiles('tests/signet-e2e/**') != ''
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.94.1" }
      - run: ./scripts/test-env.sh up
      # S4 und S5 (Recovery mit und ohne diese App) haben ein eigenes Veto:
      # ihr Fehlschlag blockiert unabhängig von allem anderen.
      - run: cargo test --workspace --locked --features signet -- --test-threads=1 --ignored
      - if: always()
        run: ./scripts/test-env.sh down

  mutants:
    name: Mutation Testing
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.94.1" }
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-mutants" }
      # Coverage misst Ausführung, nicht Prüfung. Ein überlebender Mutant heißt:
      # eine Zeile wird durchlaufen, ihr Ergebnis aber nicht geprüft.
      - run: cargo mutants -p trinity-verify -p trinity-signer -p trinity-keystore -p trinity-entropy

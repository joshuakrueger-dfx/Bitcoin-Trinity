# Fast path (< 10 min) on every push.
# Differential D1–D19: on every PR once the harness exists (TESTING.md §5).
# Signet and mutants: after main (TESTING.md §5).
# Structure and rationale: docs/TESTING.md §5
name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # --- Fast path: breaks on any warning --------------------------------------
  check:
    name: fmt · clippy · build · docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"            # from rust-toolchain.toml, deliberately exact
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (lockfile binding)
        run: cargo build --workspace --locked

      # Checks the four documents against each other: every test ID has exactly one WP,
      # every decision an implementing package, no dead section reference.
      - name: check-plan
        run: python3 scripts/check_plan.py

      # "Every dependency on the signature path is an attack vector on other people's money."
      - name: Signature-path budget
        run: python3 scripts/dep_budget.py

  # --- Tests -----------------------------------------------------------------
  test:
    name: Unit · Property
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.94.1" }
      - uses: Swatinem/rust-cache@v2
      - name: Tests with fixed seed
        env:
          PROPTEST_RNG_SEED: "0x5452494e495459"   # "TRINITY" — reproducible failures
        run: cargo test --workspace --locked

  # --- Supply chain ----------------------------------------------------------
  supply-chain:
    name: deny · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.94.1" }
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-deny,cargo-audit" }
      # License allowlist: an unknown license fails the build instead of
      # slipping through. Release criterion 9b.
      - run: cargo deny check
      - run: cargo audit --deny warnings

  # --- FFI boundary ----------------------------------------------------------
  # This boundary is too important to leave to code review.
  # Script scripts/check_ffi_boundary.py and allowlist
  # crates/trinity-ffi/ffi-allowlist.toml come from WP-40 — the job is gated
  # deliberately on the allowlist and only starts when both exist.
  ffi-boundary:
    name: FFI allowlist
    runs-on: ubuntu-latest
    if: hashFiles('crates/trinity-ffi/ffi-allowlist.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.94.1" }
      - run: python3 scripts/check_ffi_boundary.py

  # --- Coverage --------------------------------------------------------------
  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    if: hashFiles('crates/*/src/*.rs') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-llvm-cov" }
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      # Thresholds per crate from docs/TESTING.md §3.2; exceptions need
      # a justification in coverage-exclusions.toml
      - run: python3 scripts/coverage_gate.py lcov.info

  # --- Differential: on every PR once the harness exists (TESTING.md §5)
  # Reactivation: WP-23 delivers tests/differential/ and the Cargo feature
  # `differential`. Then the hashFiles condition goes away; the run line
  # stays unchanged.
  differential:
    name: Differential against Bitcoin Core 30.2
    runs-on: ubuntu-latest
    needs: [check, test]
    if: hashFiles('tests/differential/**') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.94.1" }
      - name: Start test environment
        run: ./scripts/test-env.sh up
      - name: D1–D19
        run: cargo test --workspace --locked --features differential -- --test-threads=1
      - if: always()
        run: ./scripts/test-env.sh down

  # --- Signet: after main once the harness exists (TESTING.md §5)
  # Reactivation: WP-45 delivers tests/signet-e2e/ and the Cargo feature
  # `signet` (S1–S8/S32). Then the hashFiles condition goes away; the
  # run line stays unchanged.
  signet:
    name: Signet scenarios S1–S36
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && hashFiles('tests/signet-e2e/**') != ''
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.94.1" }
      - run: ./scripts/test-env.sh up
      # S4 and S5 (recovery with and without this app) have their own veto:
      # their failure blocks independently of everything else.
      - run: cargo test --workspace --locked --features signet -- --test-threads=1 --ignored
      - if: always()
        run: ./scripts/test-env.sh down

  mutants:
    name: Mutation Testing
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.94.1" }
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-mutants" }
      # Coverage measures execution, not checking. A surviving mutant means:
      # a line is run, but its result is not checked.
      - run: cargo mutants -p trinity-verify -p trinity-signer -p trinity-keystore -p trinity-entropy

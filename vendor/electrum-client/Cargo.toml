[package]
edition = "2021"
rust-version = "1.75.0"
name = "electrum-client"
version = "0.25.0"
authors = ["Alekos Filini <alekos.filini@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Bitcoin Electrum client library. Supports plaintext, TLS and Onion servers."
homepage = "https://github.com/bitcoindevkit/rust-electrum-client"
documentation = "https://docs.rs/electrum-client/"
readme = "README.md"
keywords = [
    "bitcoin",
    "electrum",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitcoindevkit/rust-electrum-client"

[features]
default = [
    "proxy",
    "rustls",
]
openssl = ["dep:openssl"]
proxy = [
    "byteorder",
    "winapi",
    "libc",
]
# Trinity WP-14 vendor patch: optional dep renamed to rustls_crate so the
# feature named `rustls` does not collide with dep:rustls (which made
# rustls-ring also enable rustls/default → aws-lc-sys). Upstream 0.25.0.
rustls = [
    "webpki-roots",
    "dep:rustls_crate",
    "rustls_crate/default",
]
rustls-ring = [
    "webpki-roots",
    "dep:rustls_crate",
    "rustls_crate/ring",
    "rustls_crate/logging",
    "rustls_crate/std",
    "rustls_crate/tls12",
]
use-openssl = ["openssl"]
use-rustls = ["rustls"]
use-rustls-ring = ["rustls-ring"]

[lib]
name = "electrum_client"
path = "src/lib.rs"

[[example]]
name = "jwt_auth"
path = "examples/jwt_auth.rs"

[[example]]
name = "jwt_dynamic_auth"
path = "examples/jwt_dynamic_auth.rs"

[[example]]
name = "plaintext"
path = "examples/plaintext.rs"

[[example]]
name = "ssl"
path = "examples/ssl.rs"

[[example]]
name = "tor"
path = "examples/tor.rs"

[dependencies.bitcoin]
version = "0.32"
features = ["serde"]

[dependencies.byteorder]
version = "1.0"
optional = true

[dependencies.log]
version = "^0.4"

[dependencies.openssl]
version = "0.10"
optional = true

[dependencies.rustls_crate]
package = "rustls"
version = "0.23.21"
optional = true
default-features = false

[dependencies.serde]
version = "^1.0"
features = ["derive"]

[dependencies.serde_json]
version = "^1.0"

[dependencies.webpki-roots]
version = "0.25"
optional = true

[dev-dependencies.bitreq]
version = "0.3.4"
features = [
    "async-https",
    "json-using-serde",
]

[dev-dependencies.tokio]
version = "1"
features = ["full"]

[target."cfg(unix)".dependencies.libc]
version = "0.2"
optional = true

[target."cfg(windows)".dependencies.winapi]
version = "0.3.9"
features = ["winsock2"]
optional = true

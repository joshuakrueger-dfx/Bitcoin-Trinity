[package]
name         = "trinity-verify"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description  = "Independent Trinity descriptor parser (WP-20; no miniscript)"

[dependencies]
# DELIBERATELY WITHOUT miniscript — the verifier parses independently
# (SPECIFICATION.md §1.5, Decision E2). Enforced by deny.toml [bans].
# trinity-types supplies Fingerprint only (pure value type; no I/O).
# bitcoin is used for Xpub base58check validation only — not for
# descriptor/miniscript parsing. BIP-380 checksum is implemented here
# from the BIP text, not from bitcoin::descriptor / miniscript.
trinity-types = { path = "../trinity-types", version = "0.1.0" }
bitcoin = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

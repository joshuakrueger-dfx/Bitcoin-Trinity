[package]
name         = "trinity-verify"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description  = "Independent Trinity descriptor parser, derivation, and PSBT verify V1–V10 (no miniscript)"

[dependencies]
# DELIBERATELY WITHOUT miniscript — the verifier parses, derives, and checks
# independently (SPECIFICATION.md §1.5, Decision E2). Enforced by
# deny.toml [bans].
# trinity-types supplies Fingerprint + PsbtVerdict (pure value types; no I/O).
# bitcoin is used for: (1) Xpub base58check field decode only — never
# Xpub::derive_pub / ckd_pub; (2) re-exports of hashes (HMAC-SHA512) and
# secp256k1 for own CKDpub; (3) script assembly / Address for own
# witnessScript; (4) PSBT deserialization (shared layer per §1.5 table);
# (5) base64 for the exported verify_psbt string entry. BIP-380 checksum is
# implemented here from the BIP text.
trinity-types = { path = "../trinity-types", version = "0.1.0" }
bitcoin = { workspace = true, features = ["base64"] }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

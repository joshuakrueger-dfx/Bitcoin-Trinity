[package]
name         = "trinity-signer"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[dependencies]
trinity-types = { path = "../trinity-types", version = "0.1.0" }
trinity-keystore = { path = "../trinity-keystore", version = "0.1.0" }
trinity-verify = { path = "../trinity-verify", version = "0.1.0" }
trinity-entropy = { path = "../trinity-entropy", version = "0.1.0" }
bitcoin = { workspace = true }
bitcoinconsensus = { workspace = true, optional = true }
argon2 = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
chacha20poly1305 = { workspace = true }
getrandom = { workspace = true }

[features]
default = []
# Test doubles (`FakeClock`, `FakeBlockHeightSource`). Same gate as
# `trinity-keystore`'s `FakePlatformKeyStore`.
test-util = []
# D7/D8 against Core `walletprocesspsbt`. Requires the WP-02 test environment.
# Does not re-export `sign_a` / `sign_b` — those stay crate-internal and the
# tests live in `src/` under `cfg(test)`. Cargo forbids optional
# `[dev-dependencies]`; the dep is therefore always listed, and this feature
# only turns on `trinity-differential/differential` (RPC + `rpc_signer`).
differential = ["trinity-differential/differential"]
# O7: forwards rust-bitcoin's optional `bitcoinconsensus` feature (and the
# exact workspace pin). Off by default — no production path uses it (WP-36).
bitcoinconsensus = ["dep:bitcoinconsensus", "bitcoin/bitcoinconsensus"]

[dev-dependencies]
proptest = { workspace = true }
trinity-keystore = { path = "../trinity-keystore", version = "0.1.0", features = ["test-util"] }
trinity-differential = { path = "../../tests/differential", version = "0.1.0" }

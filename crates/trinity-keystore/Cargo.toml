[package]
name         = "trinity-keystore"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description  = "On-device encrypted blobs for keys A and B (Spec §2.4)"

[features]
# Test-only surface: explicit-nonce encrypt, plus `FakePlatformKeyStore`.
# Not a default — production must not take a nonce, and other crates import
# the fake only as a dev-dependency (WP-33 / S9 / S28).
test-util = []

[dependencies]
trinity-types = { path = "../trinity-types", version = "0.1.0" }
chacha20poly1305 = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[package]
name         = "trinity-entropy"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description  = "Seed generation: OS-CSPRNG OR-combined with optional additional entropy (Spec §2.2)"

[dependencies]
trinity-types = { path = "../trinity-types", version = "0.1.0" }
bitcoin = { workspace = true }
